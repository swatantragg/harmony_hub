services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gcloud:latest
    container_name: gcloud-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8100
      CLIENT_DIST: /app/client/dist
      MONGODB_URI: ${DOCKER_MONGODB_URI:-${MONGODB_URI}}
    ports:
      - '127.0.0.1:8100:8100'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8100/healthz').then(r=>r.json()).then(j=>process.exit(j.live?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  clamav:
    image: clamav/clamav:1.4
    container_name: gcloud-clamav
    profiles: ['av']
    restart: unless-stopped
    expose:
      - '3310'
    volumes:
      - clamav-db:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  mongo:
    image: mongo:7
    container_name: gcloud-mongo
    profiles: ['local']
    restart: unless-stopped
    command: ['--auth', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-gcloud}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-gcloud}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USER:-gcloud}
        - --password
        - ${MONGO_ROOT_PASSWORD:-}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
  proxy:
    image: caddy:2-alpine
    container_name: gcloud-proxy
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN:-localhost}
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-app:8100}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  clamav-db:
  caddy-data:
  caddy-config:
